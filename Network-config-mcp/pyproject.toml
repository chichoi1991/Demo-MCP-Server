[project]
name = "network-config-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server returning standard network device configurations and vendor documentation links"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.1.2",
    "uvicorn[standard]>=0.24.0",
    "starlette>=0.27.0",
    "anyio>=3.7.0",
]

[project.scripts]
network-config-mcp = "network_config_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_config_mcp"]
