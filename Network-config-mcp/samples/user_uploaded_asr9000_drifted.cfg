!
! Cisco ASR 9000 — User Uploaded Sample (DRIFTED from Standard)
! Site: DC2-Edge-A03 / Submitted by: NOC-Operator-Kim
! Purpose: 표준 컨피그 대비 차이점이 의도적으로 다수 포함된 비교 테스트용 샘플
!
! ▼ 주요 차이 요약 (Standard vs This sample) ─────────────────────
!  [SYSTEM]       hostname / domain / banner 변경
!  [SYSTEM]       NTP 서버 1개 누락 (10.1.1.2)
!  [LOGGING]      로깅 대상 IP 다름, 콘솔 severity 완화 (critical → warning)
!  [AAA]          TACACS+ 키 노출(평문) + RADIUS 미설정
!  [SSH]          SSH timeout 60s (표준 30s) / session-limit 32 (표준 16)
!  [MGMT]         보조 MgmtEth(0/RSP0/CPU0/1) 누락
!  [INTF]         TenGigE0/0/0/0 MTU 1500 (표준 9216) / IPv6 누락 / flow-control 누락
!  [INTF]         HundredGigE0/1/0/0 description 누락 + load-interval 미설정
!  [ROUTING]      IS-IS 미설정 (OSPF만 사용 중) — 표준은 IS-IS+SR이 기본
!  [ROUTING]      OSPF area 0에 추가 인터페이스 등록(TenGigE0/0/0/0) — 표준은 IS-IS 사용
!  [BGP]          neighbor-group 미사용, 개별 neighbor에 직접 설정
!  [BGP]          maximum-paths eBGP 2 (표준 4) / IPv6 AF 누락
!  [MPLS]         MPLS LDP 미설정
!  [QoS]          정책 1 클래스 누락(VIDEO-TRAFFIC) / DEFAULT 클래스 WRED 미설정
!  [SECURITY]     MGMT-ACL 22번 포트 거부 룰 누락 → SSH 누구나 가능
!  [SNMP]         community 이름 다름 ('public' RW로 잘못 설정) / location 다름
! ────────────────────────────────────────────────────────────────
!
hostname ASR9000-Edge-DC2
domain name corp.local
!
clock timezone KST 9
ntp
 server 10.1.1.1
 source MgmtEth0/RSP0/CPU0/0
!
banner login ^C
DC2 Edge Router - Authorized Access Only
^C
!
logging buffered 8192 informational
logging console warning
logging trap informational
logging 10.2.2.50 vrf default severity info
logging source-interface MgmtEth0/RSP0/CPU0/0
service timestamps log datetime msec
service timestamps debug datetime msec
!
!---------------------------------------------------------------
! AAA / TACACS+ / SSH (RADIUS NOT configured)
!---------------------------------------------------------------
tacacs-server host 10.1.1.20 port 49
 key 7 PlainTextKey!@#
!
aaa authentication login default group tacacs+ local
aaa authentication enable default group tacacs+ enable
aaa authorization exec default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
!
ssh server v2
ssh server vrf default
ssh timeout 60
ssh server rate-limit 60
ssh server session-limit 32
ssh key-exchange group dh-group14-sha1
!
line default
 exec-timeout 30 0
 session-timeout 60
 transport input ssh
!
line console
 exec-timeout 0 0
!
vty-pool default 0 16
!
!---------------------------------------------------------------
! Management Interface (Primary only — Secondary missing)
!---------------------------------------------------------------
vrf mgmt
 address-family ipv4 unicast
!
interface MgmtEth0/RSP0/CPU0/0
 description Management
 vrf mgmt
 ipv4 address 192.168.2.50 255.255.255.0
 no shutdown
!
router static
 address-family ipv4 unicast
  0.0.0.0/0 10.0.1.254
 !
 vrf mgmt
  address-family ipv4 unicast
   0.0.0.0/0 192.168.2.1
  !
 !
!
!---------------------------------------------------------------
! Loopback
!---------------------------------------------------------------
interface Loopback0
 description Router-ID
 ipv4 address 10.20.20.5 255.255.255.255
!
!---------------------------------------------------------------
! Physical Interfaces (drifted: MTU, IPv6, flow-control)
!---------------------------------------------------------------
interface TenGigE0/0/0/0
 description Uplink-1
 mtu 1500
 ipv4 address 10.0.5.1 255.255.255.252
 no shutdown
!
interface HundredGigE0/1/0/0
 mtu 9216
 ipv4 address 10.0.6.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2/0/0
 description Access-SW
 mtu 1514
 ipv4 address 172.16.5.1 255.255.255.0
 negotiation auto
 no shutdown
!
!---------------------------------------------------------------
! OSPF (IS-IS not configured — standard uses IS-IS+SR)
!---------------------------------------------------------------
router ospf 1
 router-id 10.20.20.5
 log adjacency changes
 auto-cost reference-bandwidth 10000
 nsf cisco
 area 0
  interface Loopback0
   passive enable
  !
  interface TenGigE0/0/0/0
   cost 1
   hello-interval 10
   dead-interval 40
  !
  interface GigabitEthernet0/2/0/0
   cost 10
   hello-interval 10
   dead-interval 40
  !
 !
!
!---------------------------------------------------------------
! BGP (neighbor-group not used, IPv6 AF missing, fewer ECMP paths)
!---------------------------------------------------------------
router bgp 65000
 bgp router-id 10.20.20.5
 bgp graceful-restart restart-time 120
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths ebgp 2
 !
 neighbor 10.0.5.2
  remote-as 65001
  update-source Loopback0
  description Edge-1-BGP
  timers 30 90
  address-family ipv4 unicast
  !
 !
 neighbor 10.0.6.2
  remote-as 65001
  update-source Loopback0
  description Edge-2-BGP
  timers 30 90
  address-family ipv4 unicast
  !
 !
!
!---------------------------------------------------------------
! (MPLS LDP block missing — standard configures LDP on uplinks)
!---------------------------------------------------------------
!
!---------------------------------------------------------------
! QoS (VIDEO class missing, no WRED on default class)
!---------------------------------------------------------------
class-map match-any CRITICAL-TRAFFIC
 match dscp ef
 match protocol bgp
 end-class-map
!
class-map match-any DEFAULT-TRAFFIC
 match any
 end-class-map
!
policy-map QOS-INGRESS
 class CRITICAL-TRAFFIC
  priority level 1
  police rate 50 mbps burst 10 ms
 !
 class DEFAULT-TRAFFIC
  queue-limit 100 ms
 !
 end-policy-map
!
interface TenGigE0/0/0/0
 service-policy input QOS-INGRESS
!
!---------------------------------------------------------------
! Security ACL (deny rule missing → SSH OPEN to all)
!---------------------------------------------------------------
ipv4 access-list MGMT-ACL
 10 permit tcp 10.1.0.0/16 any eq 22
 20 permit tcp 192.168.2.0/24 any eq 22
 30 permit ipv4 any any
!
interface MgmtEth0/RSP0/CPU0/0
 ipv4 access-group MGMT-ACL ingress
!
!---------------------------------------------------------------
! SNMP (community 'public' RW — security risk!)
!---------------------------------------------------------------
snmp-server community public RW
snmp-server host 10.2.2.30 traps version 2c public
snmp-server traps bgp
snmp-server traps ospf state-change
snmp-server contact ops@corp.local
snmp-server location DC2-Rack-B07
!
end
