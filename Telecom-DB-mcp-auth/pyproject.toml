[project]
name = "telecom-db-mcp"
version = "0.1.0"
description = "In-memory DuckDB query service + MCP server for telecom device analysis CSV data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "mcp>=1.1.2",
    "uvicorn[standard]>=0.24.0",
    "starlette>=0.27.0",
    "anyio>=3.7.0",
]

[project.scripts]
telecom-db-mcp = "telecom_db_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_db_mcp"]
