[project]
name = "youtube-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for YouTube video search using yt-dlp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2024.12.0",
    "mcp>=1.1.2",
    "uvicorn[standard]>=0.24.0",
    "starlette>=0.27.0",
    "anyio>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
